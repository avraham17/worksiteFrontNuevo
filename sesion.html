<body>


  <div class="container">

    <div class="left-panel"> <div id="nn"> <img src="assets/la_oportunidad_436x400.png" width="350px"></div>
      <div class="overlay">
        <h1>Encuentra tu próximo empleo</h1>
        <p>¿ Estas listo para encontrar el trabajo de tus sueños ?
          Conecta con empresas, descubre oportunidades y da el siguiente paso en tu carrera profesional.
        </p>
      </div>a
    </div>

    
    <div class="right-panel">
      <div class="login-box">
        <h2>Iniciar Sesión</h2>
        <p>Accede a tu cuenta </p>

        <form id="loginForm">
          <div class="input-box">
            <label>Correo electrónico</label>
            <input id="email" type="email" placeholder="ejemplo@correo.com" required>
          </div>

          <div class="input-box">
            <label>Contraseña</label>
            <input id="password" type="password" placeholder="••••••••" required>
          </div>

          <div class="extras">
            <label>
              <input type="checkbox">
              Recordarme
            </label>
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <button id="btnLogin" type="submit">Entrar</button>
          

          <div class="divider">
            <span>o</span>
          </div>

          <div class="register">
            ¿No tienes cuenta?
            <a href="registro.html">Crear tu perfil </a>
          </div>
        </form>
      </div>
    </div>

  </div>
