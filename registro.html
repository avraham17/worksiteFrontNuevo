<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/registro.css">
    <title>Registro - worsite</title>
    </head>
<body>
  
    <div class="registro-container">
        <h2>Registrate en WorkSite </h2>
        <br>
        <form action="inicio.html" >
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" required>
             
            <label for="tipoDocumento">Tipo de Documento:</label>
             <select id="tipoDocumento" name="tipoDocumento" required>
                <option value="">Seleccione una opción</option>
                <option value="CC">Cédula de Ciudadanía</option>
                <option value="CE">Cédula de Extranjería</option> 
             </select>
             <label for="telefono">Número de identificación</label>
            <input type="tel" id="telefono" name="telefono" required>

            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" required>

            <label for="profesion">Profesión cargo u oficio</label>
            <input type="text" id="profesion" name="profesion" required>

            <label for="experiencia">Años de experiencia</label>
            <select id="experiencia" name="experiencia">
                <option>Sin experiencia</option>
                <option>1-2 años</option>
                <option>3-5 años</option>
                <option>Más de 5 años</option>
            </select>

            <label for="cv">Subir hoja de vida (PDF)</label>
            <input type="file" id="cv" name="cv" accept=".pdf">

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>

            <label for="confirmar">Confirmar contraseña</label>
            <input type="password" id="confirmar" name="confirmar" required>

            <button type="submit">Registrarse</button>
        </form>

        <div class="login-link">
            <p>¿Ya tienes cuenta? <a href="sesion.html">Inicia sesión</a></p>
        </div>
    </div>

</body>
</html>
