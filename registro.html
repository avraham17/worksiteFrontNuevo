<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - WorkSite</title>
<link rel="stylesheet" href="css/registro.css">
</head>
<body>

<div class="registro-container">
    <div class="header">
        <h1>WorkSite</h1>
        <p>Crea tu perfil </p>
    </div>

    <form id="formRegistro" action="inicio 2.html" >
        <div class="grid">
            <div>
                <label>Nombres</label>
                 <input type="text" id="nombre" name="nombre" required>
            </div>

            <div>
                <label>Apellidos</label>
               <input type="text" id="Apellido" name="Apellido" required>
            </div>

            <div>
                <label>Correo electrónico</label>
               <input type="email" id="correo" name="correo" required>
            </div>

            <div>
                <label>Teléfono</label>
                <input type="text" id="telefono" name="telefono" required>
            </div>

            <div>
                 <label for="tipoDocumento">Tipo de Documento:</label>
             <select id="tipoDocumento" name="tipoDocumento" required>
                <option value="">Seleccione una opción</option>
                <option value="CC">Cédula de Ciudadanía</option>
                <option value="CE">Cédula de Extranjería</option> 
             </select>
            </div>

            <div>
                <label>Número de documento</label>
                <input type="text" id="Cedula" name="cedula" required>

            </div>

            <div>
                <label>Fecha de nacimiento</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento"required >
            </div>

            <div>
                <label>Género</label>
                <select type="text" id="Genero" name="Genero" required>
                    
                    <option>Masculino</option>
                    <option>Femenino</option>
                    <option>Otro</option>
                </select>
            </div>

            <div>
                <label>Años de experiencia</label>
                <input type="text" id="experiencia" name="experiencia" required>
            </div>

            <div>
                <label>Hoja de vida (PDF)</label>
                     <input type="file" id="cv" name="cv" accept=".pdf">
            </div>

            <div>
                <label>Contraseña</label>
                <input type="password" id="contraseña" name="password" required>
            </div>

            <div>
                <label>Confirmar contraseña</label>
                <input type="password" id="confirmar" name="confirmar" required>
            </div>
        </div>

          <button  id="botonRegistrarse"type="button"  class="bntn bnt-primary" >Registrarse</button>
    </form>

    <p class="login-link">¿Ya tienes cuenta? <a href="sesion.html">Inicia sesión</a></p>
</div>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


        <script src="js/registro.js"></script>
        <script src="js/core.js"></script>

</body>
</html>
